name: RC Safety Check
on: [push]
jobs:
  safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, gd
      - name: PHP syntax (PHP ${{ matrix.php-version }})
        run: |
          err=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null 2>msg.txt || { echo "PHP SYNTAX ERROR in $f:"; cat msg.txt; err=1; }
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          if [ "$err" -ne 0 ]; then echo "::error::PHP errors"; exit 1; fi
          echo "All PHP OK."
      - name: JSON validity
        run: |
          err=0
          while IFS= read -r -d '' j; do
            php -r 'json_decode(file_get_contents($argv[1])); exit(json_last_error()===JSON_ERROR_NONE?0:1);' "$j" \
              || { echo "BROKEN JSON: $j"; err=1; }
          done < <(find . -path ./vendor -prune -o -name '*.json' -print0)
          if [ "$err" -ne 0 ]; then exit 1; fi
          echo "All JSON OK."
      - name: SVG sanitizer tests
        run: php tests/svg_sanitizer_test.php
      - name: Mojibake scan
        run: |
          if grep -rInE 'â€|âš|Ã©' --include='*.php' --include='*.js' --include='*.css' . 2>/dev/null | grep -v vendor | head -5; then
            echo "::error::Mojibake"; exit 1
          fi
          echo "No mojibake."
      - name: No tracked auth_config
        run: |
          bad=$(git ls-files 2>/dev/null | grep -E '(^|/)auth_config\.php$' | grep -v example || true)
          # Also fail if file exists in tree outside example (for zip-based trees without git)
          if [ -f data/auth_config.php ] || [ -f data/config/auth_config.php ]; then
            echo "::error::auth_config.php must not ship in the tree"; exit 1
          fi
          echo "OK — no live auth_config."
      - name: Entry points bootstrap allow-list
        run: |
          allow='version.php|health.php|social_icon.php|sw.js'
          err=0
          for f in *.php; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if echo "$base" | grep -qE "^($allow)$"; then continue; fi
            if grep -q 'tenant_bootstrap' "$f" || grep -q "require.*bootstrap" "$f"; then continue; fi
            # thin wrappers that require tools/
            if grep -q "require __DIR__ . '/tools/" "$f"; then continue; fi
            echo "Missing tenant_bootstrap: $f"; err=1
          done
          if [ "$err" -ne 0 ]; then exit 1; fi
          echo "Entry points OK."
