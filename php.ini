; Resource Centre — optional domain-level php.ini
; Version: 260926.02
;
; Plesk: only used when the domain PHP handler is configured to pick up a
; custom php.ini in the domain root (not all shared plans do this).
; Prefer .user.ini + Plesk "Additional configuration directives" first.
;
; If this file is active, the lines below apply.

date.timezone = Asia/Kolkata
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
memory_limit = 256M
session.gc_maxlifetime = 31536000

; Enable Indian Rupee / en_IN NumberFormatter (lakh-crore grouping)
extension = intl
